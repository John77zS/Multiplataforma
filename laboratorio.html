<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicio de Laboratorio | Sistema Bioquímico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body laboratorio-body">

  <div class="dashboard-background bio-background">
    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>

    <span class="bio-bubble bubble-1"></span>
    <span class="bio-bubble bubble-2"></span>
    <span class="bio-bubble bubble-3"></span>
    <span class="bio-bubble bubble-4"></span>
    <span class="bio-bubble bubble-5"></span>

    <div class="molecule molecule-one">
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="molecule molecule-two">
      <span></span><span></span><span></span>
    </div>
  </div>

  <main class="dashboard-page bio-dashboard-page laboratorio-page">

    <header class="dashboard-header bio-dashboard-header laboratorio-header">
      <div>
        <span class="dashboard-badge">Área de Laboratorio</span>
        <h1>Servicio de Laboratorio</h1>
        <p id="bienvenida">Bienvenido al sistema</p>
      </div>

      <div class="header-actions">
        <a href="dashboard.html" class="back-btn">Volver al dashboard</a>
        <button class="logout-top" id="logoutBtn">Cerrar sesión</button>
      </div>
    </header>

    <section class="module-preview bio-module-preview laboratorio-panel" id="modulePreview">
      <h2>Cargando laboratorio...</h2>
      <p>Espere un momento.</p>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
